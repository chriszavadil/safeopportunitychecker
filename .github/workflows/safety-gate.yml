name: Safety Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety-gate:
    name: Tests and safety gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run CI
        run: node scripts/ci.js

      - name: Build Docker image
        run: docker build -t safe-opportunity-checker:ci .
